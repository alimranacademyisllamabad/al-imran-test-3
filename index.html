const stages=[['IQ',100],['Mathematics',30],['Science',30],['English',25],['Urdu',15]];
let stageIndex=0, local=0, answers={}, seconds=50*60, timerId;

function startTimer(){clearInterval(timerId);seconds=50*60;timerId=setInterval(()=>{seconds--;renderTimer();if(seconds<=0){clearInterval(timerId);finishStage(true)}},1000);renderTimer()}
function renderTimer(){let m=Math.floor(seconds/60),s=seconds%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}

function renderNav(){let n=document.getElementById('nav'),arr=stageQs();n.innerHTML='';arr.forEach((_,i)=>{let b=document.createElement('button');b.textContent=i+1;if(answers[stageIndex+'-'+i]!==undefined)b.className='done';if(i===local)b.className+=' current';b.onclick=()=>{local=i;render()};n.appendChild(b)})}
function nextQ(){saveRadio();if(local<stageQs().length-1){local++;render()}}
function prevQ(){saveRadio();if(local>0){local--;render()}}
function saveRadio(){let r=document.querySelector('input[name=opt]:checked');if(r)answers[stageIndex+'-'+local]=Array.from(document.querySelectorAll('input[name=opt]')).indexOf(r)}
function finishStage(auto=false){saveRadio();clearInterval(timerId);let arr=stageQs(),score=0;arr.forEach((x,i)=>{if(answers[stageIndex+'-'+i]===x.a)score++});let pct=score/arr.length*100;let passed=pct>=80;let res=document.getElementById('result');res.classList.remove('hidden');res.innerHTML='<h2>'+stages[stageIndex][0]+' Result</h2><p><b>Score:</b> '+score+' / '+arr.length+' ('+pct.toFixed(1)+'%)</p><p><b>Required:</b> 80%</p><p style="font-size:20px">'+(passed?'✅ Stage qualified.':'❌ Stage not qualified.')+'</p>'+(passed&&stageIndex<stages.length-1?'<button class="btn submit" onclick="nextStage()">Unlock Next Stage</button>':stageIndex===stages.length-1&&passed?'<h3>🎉 Test completed successfully.</h3>':'<p>You must achieve at least 80% to unlock the next stage.</p>');document.getElementById('test').classList.add('hidden');res.scrollIntoView();}

render();startTimer();
